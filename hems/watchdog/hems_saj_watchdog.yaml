# HEMS SAJ watchdog: an automation outside HEMS that takes the inverter back to plain self-consumption when HEMS stops working
# while it controls the battery. SAJ time slots repeat every day and never expire, so a schedule HEMS wrote must not outlive HEMS.
#
# Fires when, for 30 minutes, HEMS reports a status other than ok (unavailable included: a crashed or unloaded HEMS) or its last cycle
# is older than 30 minutes. There is no condition on a HEMS entity on purpose: when HEMS is down all its entities are unavailable.
# Install only at the handover (phase 4), once battery-manager is stopped: before that the slots are battery-manager's and this
# automation would clear them whenever HEMS has a bad half hour. Battery-manager is retired after the handover (Mark, 28 Oct 2026).
# Install via Settings > Automations > Create > Edit in YAML, after Mark's yes (docs/hems/phase3-saj-writer-plan.md).
alias: HEMS SAJ watchdog
description: >-
  Clears the SAJ time slots and sets Self-consumption when HEMS stops cycling while it controls the battery.
mode: single
triggers:
  - trigger: template
    value_template: "{{ states('sensor.hems_status') != 'ok' }}"
    for: "00:30:00"
    id: status
  - trigger: template
    value_template: >-
      {% set last = states('sensor.hems_last_cycle') | as_datetime(none) %}
      {{ last is none or (now() - last).total_seconds() > 1800 }}
    for: "00:01:00"
    id: stale
conditions: []
actions:
  # the enable masks first: with no slot enabled the inverter ignores every slot, whatever its times
  - action: number.set_value
    target:
      entity_id:
        - number.saj_charge_time_enable_input
        - number.saj_discharge_time_enable_input
    data:
      value: 0
  - action: number.set_value
    target:
      entity_id: number.saj_app_mode_input
    data:
      value: 0
  # then the slot powers to 0 %, so a later mask change cannot revive an old slot
  - action: number.set_value
    target:
      entity_id:
        - number.saj_charge1_power_percent_input
        - number.saj_charge2_power_percent_input
        - number.saj_charge3_power_percent_input
        - number.saj_charge4_power_percent_input
        - number.saj_charge5_power_percent_input
        - number.saj_charge6_power_percent_input
        - number.saj_charge7_power_percent_input
        - number.saj_discharge1_power_percent_input
        - number.saj_discharge2_power_percent_input
        - number.saj_discharge3_power_percent_input
        - number.saj_discharge4_power_percent_input
        - number.saj_discharge5_power_percent_input
        - number.saj_discharge6_power_percent_input
        - number.saj_discharge7_power_percent_input
    data:
      value: 0
  - action: persistent_notification.create
    data:
      notification_id: hems_saj_watchdog
      title: HEMS watchdog
      message: >-
        HEMS stopped controlling the battery ({{ 'status ' ~ states('sensor.hems_status') if trigger.id == 'status'
        else 'no cycle since ' ~ states('sensor.hems_last_cycle') }}). The SAJ slots are cleared and the inverter is on
        Self-consumption.
