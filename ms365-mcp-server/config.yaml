name: Microsoft 365 MCP Server
version: "0.5.0"
slug: ms365_mcp_server
description: LAN-only MCP server for a personal Outlook/Hotmail account (mail, calendar, OneDrive) via Microsoft Graph
url: https://github.com/MarkBovee/ha-addons/tree/master/ms365-mcp-server
init: false
arch:
  - aarch64
  - amd64

# LAN-only: no ingress, no host_network. nginx listens on 3000 and enforces the
# bearer token; the MCP server itself only listens on 127.0.0.1 inside the container.
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: MCP endpoint (http://<ha-host>:<port>/mcp, bearer token required)

options:
  client_id: ""
  expected_username: user@outlook.com
  read_only: false
  preset: []
  message_signoff_suffix: Sent via Claude
  dynamic_tools: true
  access_token: ""

schema:
  client_id: str
  expected_username: str?
  read_only: bool
  preset:
    - list(mail|calendar|contacts|files|excel|onenote|tasks|search|personal|outlook|onedrive|all)
  message_signoff_suffix: str?
  dynamic_tools: bool
  access_token: password?
