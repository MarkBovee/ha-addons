name: Charge Amps - EV Charger Monitor
description: Monitor Charge Amps chargers and manage price-based schedules in Home Assistant
version: "2.0.1"
slug: charge_amps_ev_charger_monitor
init: false
homeassistant_api: true
hassio_role: homeassistant
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

# Options schema for UI-managed settings
options:
  email: ""
  password: ""
  host_name: "my.charge.space"
  base_url: "https://my.charge.space"
  update_interval: 1
  
  # Operation mode: standalone scheduling or legacy HEMS compatibility mode.
  operation_mode: "standalone"
  
  # Standalone mode settings. Price-based scheduling is optional.
  automation_enabled: true
  price_sensor_entity: "sensor.energy_prices_electricity_import_price"
  top_x_charge_count: 4
  price_threshold: 0.26
  # This value is written into generated schedules; it is not direct charger current control.
  max_current_per_phase: 12
  # Comma-separated connector IDs. The first valid ID is used by the current runtime.
  connector_ids: "1"

  # MQTT is used for Home Assistant Discovery and legacy compatibility ingress.
  # It is not the target interface for HEMS.
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""

schema:
  email: str
  password: str
  host_name: str
  base_url: str
  update_interval: int
  
  # standalone = price-based scheduling; hems = legacy external schedule compatibility.
  operation_mode: list(standalone|hems)?
  
  # Standalone scheduling options. The price sensor must expose EUR/kWh values.
  automation_enabled: bool
  price_sensor_entity: str
  top_x_charge_count: int(1,96)
  price_threshold: "float?"
  max_current_per_phase: int(6,32)
  connector_ids: str

  # Timezone is detected from Home Assistant automatically; CHARGER_TIMEZONE is a local fallback only.
  # Advanced MQTT settings are optional and default to the Home Assistant Mosquitto broker.
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: str?
